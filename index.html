<!DOCTYPE html>
  <header>
  <title>¡-Bueno.Computer-!</title>
  <style >
    body {   
      padding-left: 3em;
      padding-top: 2.1em;
      margin-left: 1.25em;
      margin-right: 1.25em;
      padding-right: 1em;
      padding-bottom: 0em;
      color: grey;
    }
    
    div.menu {
      background-color: #63e5ff;
      margin-bottom: 1em;
      padding-top: .5em;
      padding-bottom: .5em;
    }

    div.menu a {
      color: white;
      font-size: 2.1em;
      font-style: bold;
      underline: false;
      border-right: 2pt dashed white;
    }
    
    address {
      width: 90%;
      height: 75%;
    }

    address iframe {
      width: 90%;
      height: 110%;
    }

    
    
    div#site {
      width: 90%;
    }

    div.footer {
      padding-top: 2em;
    }

    div.footer img {
      margin-left: 35%;
      width: 30%;
      margin-right: 35%;
    }

  </style>
  <head />
  </header>
  
  <body>
    <div class="menu">
      <a id="about" href="/">Home</a>
      <a id="contact" href="/?contact">Contact</a>
      <a id="resumes" href="/?resumes">Resume</a>
      <a id="skillset" href="/?skillset">Microsoft Windows Systems Administrator</a>
      <a id="etl-to-elt" href="/?etl-to-elt">Business Analysis</a>
      <a id="programming" href="/?programming">Programming</a>
    </div>
    <address id="site">
      --!--  
    </address>
    <div id="directory" class="directory"></div>
    <div id="date-time-region">--footed-space--</div>
    <div class="footer"><img src="https://david-c-surbey.github.io/favicon.ico" /></div>
    
    <script>
      let search = document.location.search || "?about";
      const date_time = new Date();
      const directory = search.substring(1);
      const directly_for = new String("/home/") + directory + new String(".htm");

      document.getElementById("directory").innerHTML = directly_for;
      document.getElementById(new String(directory)).outerHTML = 
        "<li id=" + String(directory) + 
        " class=" + String('under-lining') + ">" + 
        document.getElementById(new String(directory)).innerHTML.value + "</li>";
      document.getElementById("site").innerHTML = "<iframe src=" + String(directly_for) + "> </iframe>";
      document.getElementById("date-time-region").innerHTML = date_time; 
    </script>
  </body>
</html>
