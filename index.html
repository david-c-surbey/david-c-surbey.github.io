<!DOCTYPE html>
  <header>
  <title>¡-David C. Surbey-!</title>
  <style >
    body {   
      padding-left: 3em;
      padding-top: 2.1em;
      margin-left: 1.25em;
      margin-right: 1.25em;
      padding-right: 1em;
      padding-bottom: 0em;
      color: grey;
      background-color: lightblue;
    }
    
    div.menu {
      background-color: blue;
      margin-bottom: 1em;
      padding-top: .5em;
      padding-bottom: .5em;
      border-right: 4pt solid black;
      border-bottom: 2pt solid black;
    }

    div.menu a {
      color: white;
      font-size: 2em;
      font: bold;
      text-decoration: none;
      border-right: 2pt dashed white;
    }
        
    div.menu-link-selected a {
      text-decoration: underscore;
      color: white;
      font-size: 1.9em;
      font-style: italic;
      border: 2pt dashed darkorange;
    }
    
    div#site {
      width: 90%;
      height: 90%;
      border-right: 16pt solid black;
      border-bottom: 10pt solid black;
      border-top: 8pt dashed black;
      border-left: 5pt solid black;
      background-color: darkorange;
      padding-bottom: 15%;
      margin-bottom: 5%;
    }

    iframe {
      font-size: 1.4em;
      width: 70%;
      height: auto;
      background-color: lightblue;
      border: 6pt dashed white;
      margin-left: 2%;
      margin-top: 2%;
      padding-left: 4%;
      padding-top: 4%;
    }

    div.footer {
      padding-top: 2em;
      border-top: 6pt solid black;
      border-left: 4pt solid black;
    }

    div.footer .home-address {
      background-color: darkorange;
      font-size:  1.2em;
      color:  white;
      font: bold;
      border: 4pt dashed green;
      padding: 1em;
      margin-left: -5%;
      width: 65%;
    }

    div.footer .div {
      border: 10pt dashed black;
    }

    div.footer img {
      padding-left: 85%;
      margin-top: -8%;
      width: 10%;
    }

  </style>
  <head />
  </header>
  
  <body>
    <div class="menu">
      <table>
        <tr>
          <td><a id="about" href="/">-Home--</a></td> 
          <td><a id="contact" href="/?contact">-Contact--</a></td> 
          <td><a id="files" href="/?files">-Files--</a></td>
        </tr>
        <tr>
          <td><a id="skillset" href="/?skillset">-Windows Admin--</a></td> 
          <td><a id="etl-to-elt" href="/?etl-to-elt">-Business Analyst--</a></td>
          <td><a id="programming" href="/?programming">-Programmer--</a></td>
        </tr>
      </table>
    </div>
    <div id="site">
      <iframe></iframe>
    </div>
    <div class="footer">
      <div class="home-address">
        <div id="directory" class="directory"></div>
        <div id="date-time-region">--footed-space--</div>
      </div>
      <img onclick="home()" src="https://david-c-surbey.github.io/favicon.ico" />
      <script> 
        function home() { window.location.replace("/") }
      </script>
    </div>
    
    <script>
      let search = document.location.search || "?about";
      const date_time = new Date();
      const directory = search.substring(1);
      const directly_for = new String("/home/") + directory + new String(".htm");

      document.getElementById("directory").innerHTML = directly_for;
      document.getElementById(new String(directory)).outerHTML = 
        "<div class=" + String('menu-link-selected') + ">" + 
        document.getElementById(String(directory)).outerHTML + "</div>";
      document.getElementById("site").innerHTML = "<iframe src=" + String(directly_for) + "> </iframe>";
      document.getElementById("date-time-region").innerHTML = date_time; 
    </script>
  </body>
</html>
